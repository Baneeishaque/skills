# Skills Workflow Add New Product Or Feature Reference

## Action

Follow the add-new-product-or-feature-reference workflow:
1. Create a new directory under skills/cloudflare/references/{product}/
2. Add or update the following files: README.md, api.md, configuration.md, patterns.md, gotchas.md (sometimes not all, but at least 3-5 of these)
3. Update skills/cloudflare/SKILL.md to reference the new product/feature

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: skills/cloudflare/SKILL.md, skills/cloudflare/references/*/README.md, skills/cloudflare/references/*/api.md

